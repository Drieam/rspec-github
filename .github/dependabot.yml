version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      day: "monday"
      interval: "weekly"
      time: "07:00"
      timezone: "Europe/Amsterdam"

  - package-ecosystem: "bundler"
    allow:
      - dependency-type: "all"
    directory: "/"
    groups:
      rspec:
        applies-to: version-updates
        patterns:
          - "rspec*"
      rubocop:
        applies-to: version-updates
        patterns:
          - "rubocop*"
      ruby:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      ruby-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    schedule:
      day: "monday"
      interval: "weekly"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    versioning-strategy: "increase-if-necessary"
