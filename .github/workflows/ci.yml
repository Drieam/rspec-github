name: CI
on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: rubocop
        run: bundle exec rubocop
  rspec:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
        gemfile:
          - rspec3
          - rspec4
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
    name: RSpec tests ruby ${{ matrix.ruby }} with ${{ matrix.gemfile }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run RSpec
        run: bundle exec rspec spec/rspec
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run RSpec in GITHUB_WORKSPACE
        run: '! bundle exec rspec spec/integration/failing_spec.rb'
      - name: Run RSpec in sub-directory of GITHUB_WORKSPACE
        run: |
          cd spec/integration
          bundle exec rspec relative_path/pending_spec.rb --require ../spec_helper --format RSpec::Github::Formatter
